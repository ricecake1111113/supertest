<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canadian City Guesser</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h3 {
            color: #2c3e50;
            text-align: center;
        }
        #map {
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 20px 0;
        }
        .game-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        #city-input {
            flex-grow: 1;
            padding: 10px;
            font-size: 16px;
            min-width: 200px;
        }
        button {
            padding: 10px 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #2980b9;
        }
        #reset-btn {
            background: #e74c3c;
        }
        #reset-btn:hover {
            background: #c0392b;
        }
        .stats-panel {
            display: flex;
            justify-content: space-around;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        #message {
            min-height: 20px;
            text-align: center;
            font-weight: bold;
            margin: 10px 0;
            color: #e74c3c;
        }
        .city-list-container {
            margin-top: 20px;
        }
        .sort-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        #city-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .city-item {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
        }
        .city-item:hover {
            background-color: #f5f5f5;
        }
        .city-item.highlighted {
            background-color: #e3f2fd;
            font-weight: bold;
        }
        .city-item span:first-child {
            flex-grow: 1;
        }
        .city-population {
            color: #666;
            font-size: 0.9em;
            min-width: 80px;
            text-align: right;
        }
        .settings {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            flex-wrap: wrap;
        }
        .settings label {
            font-weight: bold;
        }
        .size-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #population-slider {
            width: 100px;
        }
        @media (max-width: 768px) {
            .game-controls, .sort-controls {
                flex-direction: column;
            }
            #city-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Canadian City Guesser</h1>
        
        <div class="game-controls">
            <input type="text" id="city-input" placeholder="Loading city data..." autocomplete="off" disabled>
            <button id="reset-btn">Reset Progress</button>
            
            <div class="settings">
                <label>Marker Size:</label>
                <select id="marker-size">
                    <option value="fixed">Fixed Size</option>
                    <option value="population">By Population</option>
                </select>
                <select id="fixed-size" class="size-option">
                    <option value="5">Small</option>
                    <option value="8" selected>Medium</option>
                    <option value="12">Large</option>
                </select>
                <div id="population-scale" class="size-option" style="display:none">
                    <label>Scale: </label>
                    <input type="range" id="population-slider" min="1" max="20" value="10">
                </div>
            </div>
        </div>

        <div id="map-container">
            <div id="map"></div>
        </div>

        <div class="stats-panel">
            <div>Cities Guessed: <span id="count">0</span></div>
            <div>Population Covered: <span id="population">0</span></div>
            <div>Score: <span id="score">0</span></div>
        </div>

        <div id="message"></div>

        <div class="city-list-container">
            <h3>Guessed Cities</h3>
            <div class="sort-controls">
                <button id="sort-alpha">A-Z</button>
                <button id="sort-population">Population</button>
                <button id="sort-province">Province</button>
                <button id="sort-added">Added Order</button>
            </div>
            <div id="city-list"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
